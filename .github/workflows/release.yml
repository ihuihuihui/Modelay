name: Release Modelay

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run check:version
      - name: Match tag to package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match $expected" >&2
            exit 1
          }

  bundle:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Require updater signing secrets
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: test -n "$SIGNING_KEY" && test -n "$SIGNING_PASSWORD"
      - name: Import stable macOS development signing identity
        if: runner.os == 'macOS'
        shell: bash
        env:
          MODELAY_MACOS_CERTIFICATE: ${{ secrets.MODELAY_MACOS_CERTIFICATE }}
          MODELAY_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MODELAY_MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MODELAY_MACOS_CERTIFICATE"
          test -n "$MODELAY_MACOS_CERTIFICATE_PASSWORD"
          certificate_path="$RUNNER_TEMP/modelay-development-code-signing.p12"
          keychain_path="$RUNNER_TEMP/modelay-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MODELAY_MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MODELAY_MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security find-certificate -c "Modelay Development Code Signing" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          echo "APPLE_SIGNING_IDENTITY=Modelay Development Code Signing" >> "$GITHUB_ENV"
      - name: Configure the public update feed
        env:
          MODELAY_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: npm run prepare:update-config
      - name: Select platform bundles
        id: bundle-args
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            bundles=$(node scripts/windows-bundles.mjs)
          else
            bundles="app,dmg"
          fi
          echo "args=--bundles $bundles --config src-tauri/tauri.release.generated.json" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Modelay v__VERSION__"
          releaseBody: "Modelay 4.0 Beta 1 adds conversation health warnings and one-click task handoff, a smaller quota capsule, unified branding, a transparent monochrome tray icon, and clearer runtime status. Existing channels and old tasks remain unchanged during upgrades. Signed in-app updates are supported."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ steps.bundle-args.outputs.args }}
