name: Release Modelay

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run check:version
      - name: Match tag to package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match $expected" >&2
            exit 1
          }

  bundle:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Require updater signing secrets
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: test -n "$SIGNING_KEY" && test -n "$SIGNING_PASSWORD"
      - name: Import stable macOS development signing identity
        if: runner.os == 'macOS'
        shell: bash
        env:
          MODELAY_MACOS_CERTIFICATE: ${{ secrets.MODELAY_MACOS_CERTIFICATE }}
          MODELAY_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MODELAY_MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MODELAY_MACOS_CERTIFICATE"
          test -n "$MODELAY_MACOS_CERTIFICATE_PASSWORD"
          certificate_path="$RUNNER_TEMP/modelay-development-code-signing.p12"
          keychain_path="$RUNNER_TEMP/modelay-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MODELAY_MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MODELAY_MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security find-certificate -c "Modelay Development Code Signing" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          echo "APPLE_SIGNING_IDENTITY=Modelay Development Code Signing" >> "$GITHUB_ENV"
      - name: Configure the public update feed
        env:
          MODELAY_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: npm run prepare:update-config
      - name: Select platform bundles
        id: bundle-args
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            bundles=$(node scripts/windows-bundles.mjs)
          else
            bundles="app,dmg"
          fi
          echo "args=--bundles $bundles --config src-tauri/tauri.release.generated.json" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Modelay v__VERSION__"
          releaseBody: |
            WindowsApps 的门卫有点严格：文件明明在眼前，却不一定允许外部应用启动。这一版给 Modelay 换了更靠谱的进门方式。

            本次更新内容：
            - 优先使用 Windows 的 Codex App Execution Alias，不直接依赖受保护的 WindowsApps 文件。
            - 候选 Codex 路径会先验证是否真正允许启动，拒绝访问的路径会被自动跳过。
            - ChatGPT 已经登录时，Modelay 会识别本地官方认证状态，不再重复要求登录。
            - 增加更多 Codex 独立安装目录和 CODEX_CLI_PATH 发现方式。
            - 登录或命令启动失败时显示具体组件路径和原因，方便继续定位。
            - 已有渠道、密钥和旧任务内容都不会被删除。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ steps.bundle-args.outputs.args }}
