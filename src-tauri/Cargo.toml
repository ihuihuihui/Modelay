[package]
name = "modelay"
version = "4.0.0-beta.2"
description = "Cross-platform provider switcher for Codex"
authors = ["Modelay"]
edition = "2021"

[lib]
name = "modelay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
regex = "1"
reqwest = { version = "0.13", features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.1"
tempfile = "3"
thiserror = "2"
toml_edit = { version = "0.23", features = ["serde"] }
url = "2"
wait-timeout = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow"] }
security-framework = "3.7"

[features]
custom-protocol = ["tauri/custom-protocol"]
